services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  estimator:
    build: .
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      # Compose network: talk to the redis service by name.
      STORE: redis
      REDIS_ADDR: redis:6379
      HTTP_ADDR: ":8080"
      GRPC_ADDR: ":9090"
      MEMBERSHIP_TTL: "14d"
    depends_on:
      - redis
