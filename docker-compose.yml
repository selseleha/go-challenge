services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: es
      POSTGRES_PASSWORD: es
      POSTGRES_DB: es
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U es -d es"]
      interval: 2s
      timeout: 5s
      retries: 10

  estimator:
    build: .
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      STORE: postgres_redis
      REDIS_ADDR: redis:6379
      DATABASE_URL: postgres://es:es@postgres:5432/es?sslmode=disable
      HTTP_ADDR: ":8080"
      GRPC_ADDR: ":9090"
      MEMBERSHIP_TTL: "14d"
      ADMIN_TOKEN: dev-admin-token
      OUTBOX_POLL_INTERVAL: "2s"
      OUTBOX_BATCH_SIZE: "100"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
